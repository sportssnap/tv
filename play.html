<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV</title>
  
  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.compiled.min.js"></script>
  
  <!-- Shaka Player UI CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/controls.css" />

  <style>
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      font-family: Arial, sans-serif; 
      color: white;
    }
    #video-container {
      max-width: 1180px;
      margin: 20px auto;
      position: relative;
    }
    #player-wrapper { 
      width: 100%; 
      min-height: 560px; 
      background: #000; 
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #logo {
      position: absolute; 
      top: 15px; 
      right: 15px; 
      width: 70px; 
      z-index: 100;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,0,64,0.5);
    }
    #running-banner {
      position: absolute; 
      bottom: 75px; 
      left: 0; 
      width: 100%;
      background: rgba(0,0,0,0.85); 
      color: white; 
      padding: 12px 0;
      z-index: 90; 
      text-align: center; 
      overflow: hidden;
    }
    #banner-text {
      display: inline-block; 
      white-space: nowrap; 
      animation: scroll 20s linear infinite;
      font-size: 17px;
    }
    @keyframes scroll { 
      0% { transform: translateX(100%); } 
      100% { transform: translateX(-100%); } 
    }
    
    .popup { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.95); 
      z-index: 1000; 
      justify-content: center; 
      align-items: center; 
    }
    .popup-content {
      background: #111; 
      padding: 30px; 
      border-radius: 12px; 
      text-align: center;
      border: 3px solid #FF0040; 
      max-width: 360px; 
      color: white; 
      position: relative;
    }
    .close-btn {
      position: absolute; 
      top: -15px; 
      right: -15px; 
      background: #FF0040; 
      color: white;
      border: none; 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; 
      font-size: 24px; 
      cursor: pointer;
    }
    .error-msg {
      color: #FF0040;
      text-align: center;
      padding: 120px 20px;
      font-size: 19px;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FF0040;
      font-size: 20px;
      z-index: 10;
    }

    /* Shaka UI Improvements */
    .shaka-video-container {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <div id="player-wrapper"></div>
    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Logo">
    <div id="running-banner">
      <div id="banner-text">Join Our Telegram @sportssnapofficial for more updates & streams!! | www.sportssnap.net</div>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h2>Join Us!</h2>
      <p>Join Sports Snap Telegram for latest streams & updates!</p>
      <a href="https://t.me/sportssnapofficial" target="_blank" 
         style="display:inline-block;padding:12px 26px;background:#000;color:#FF0040;border:2px solid #FF0040;border-radius:10px;text-decoration:none;font-weight:bold;">
        JOIN TELEGRAM
      </a>
    </div>
  </div>

  <script>
    const container = document.getElementById('player-wrapper');
    let streamUrl = null;

    function getChannel() {
      const params = new URLSearchParams(window.location.search);
      return params.get('sportssnap');
    }

    const channel = getChannel();

    if (!channel) {
      container.innerHTML = `<div class="error-msg">❌ No channel found.<br><br>Use: <strong>?sportssnap=barcelona</strong></div>`;
    } else {
      fetch('https://sportssnap.github.io/playlist/stream.json')
        .then(res => res.json())
        .then(data => {
          streamUrl = data[channel];
          if (!streamUrl) throw new Error("Channel not found");
          initShakaPlayer();
        })
        .catch(() => {
          container.innerHTML = `<div class="error-msg">❌ Stream not available or channel not found</div>`;
        });
    }

    function initShakaPlayer() {
      container.innerHTML = `
        <div class="loading">Loading Stream...</div>
        <video id="shaka-video" class="shaka-video-container" controls autoplay></video>
      `;

      const video = document.getElementById('shaka-video');

      shaka.polyfill.installAll();

      const player = new shaka.Player(video);

      // Enable Shaka's rich UI controls
      const ui = new shaka.ui.Overlay(player, container, video);
      const uiConfig = {
        controlPanelElements: [
          'play_pause', 'time_and_duration', 'spacer', 
          'mute', 'volume', 'quality', 'captions', 
          'fullscreen', 'overflow_menu'
        ],
        overflowMenuButtons: ['statistics', 'quality', 'language', 'cast'],
        seekBarColors: {
          base: 'rgba(255, 255, 255, 0.3)',
          buffered: 'rgba(255, 255, 255, 0.5)',
          played: '#FF0040'
        }
      };
      ui.configure(uiConfig);

      // Better configuration for sports/live streams
      player.configure({
        streaming: {
          bufferBehind: 40,
          bufferingGoal: 25,
          rebufferingGoal: 15,
          retryParameters: {
            maxAttempts: 6,
            baseDelay: 800,
            backoffFactor: 1.8,
            timeout: 30000
          }
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 2000000
        }
      });

      player.load(streamUrl)
        .then(() => {
          console.log('✅ Shaka Player loaded successfully');
          const loading = container.querySelector('.loading');
          if (loading) loading.remove();
        })
        .catch(err => {
          console.error('Shaka Error:', err);
          container.innerHTML = `<div class="error-msg">❌ Unable to play stream.<br>Please try again later.</div>`;
        });
    }

    // Popup
    setTimeout(() => {
      document.getElementById('popup').style.display = 'flex';
    }, 7000);

    document.querySelector('.close-btn').addEventListener('click', () => {
      document.getElementById('popup').style.display = 'none';
    });
  </script>
</body>
</html>
