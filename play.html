<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #video-container {
      max-width: 800px;
      margin: auto;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #logo {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 50px;
      z-index: 10;
    }

    #running-banner {
      position: absolute;
      bottom: 200px;
      left: 0;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 0;
      z-index: 20;
      width: 100%;
      box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.5);
    }

    #banner-text {
      display: inline-block;
      white-space: nowrap;
      animation: scroll 10s linear infinite;
      font-size: 18px;
      padding-left: 100%;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .popup {
      display: none;
      position: fixed;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background-color: #000;
      padding: 10px;
      width: 80%;
      max-width: 300px;
      border-radius: 10px;
      text-align: center;
      border: 2px solid #FF0000;
    }

    .close-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background-color: #FF0000;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .join-btn {
      display: inline-block;
      padding: 8px 16px;
      margin-top: 8px;
      background: black;
      color: red;
      border: 2px solid red;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <div id="video-container">
    <video id="video" controls poster="https://i.ibb.co/0mLQWV1/sportssnap-net.png"></video>

    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png">

    <div id="running-banner">
      <div id="banner-text">
        Join Our Telegram channel @sportssnapofficial for more updates!! | www.sportssnap.net
      </div>
    </div>
  </div>

  <div class="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h1>Join Us!</h1>
      <p>Join Sports Snap Telegram channel for more updates!</p>
      <a class="join-btn" href="https://t.me/sportssnapofficial" target="_blank">Join Now</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    function getQueryParameter(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const key = getQueryParameter('sportssnap');
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');

    async function loadStream() {
      try {
        const res = await fetch('https://sportssnap.github.io/playlist/stream.json');
        const data = await res.json();

        const streamUrl = data[key];

        if (!streamUrl) {
          console.error("No stream found for:", key);
          return;
        }

        // Load Plyr dynamically
        const plyrCSS = document.createElement("link");
        plyrCSS.rel = "stylesheet";
        plyrCSS.href = "https://cdn.plyr.io/3.7.8/plyr.css";
        document.head.appendChild(plyrCSS);

        const plyrJS = document.createElement("script");
        plyrJS.src = "https://cdn.plyr.io/3.7.8/plyr.js";

        plyrJS.onload = () => {

          const player = new Plyr(video, {
            controls: [
              'play-large', 'play', 'progress',
              'current-time', 'mute', 'volume',
              'settings', 'fullscreen'
            ]
          });

          if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              player.play();
            });
          } else {
            video.src = streamUrl;
          }
        };

        document.body.appendChild(plyrJS);

        // fullscreen fix
        video.addEventListener('dblclick', () => {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            videoContainer.requestFullscreen();
          }
        });

      } catch (err) {
        console.error("Error loading stream:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadStream);

    // popup
    document.addEventListener('DOMContentLoaded', () => {
      let closed = false;

      setTimeout(() => {
        if (!closed) {
          document.querySelector('.popup').style.display = 'flex';
        }
      }, 6000);

      document.querySelector('.close-btn').addEventListener('click', () => {
        document.querySelector('.popup').style.display = 'none';
        closed = true;
      });
    });
  </script>
</body>
</html>
