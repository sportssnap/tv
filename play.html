<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <!-- Plyr-like styling + Your Custom CSS -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 800px;
      margin: auto;
    }
    #shaka-wrapper, #iframe-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* Your Logo */
    #logo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 60px;
      z-index: 100;
      pointer-events: none;
    }

    /* Running Banner */
    #running-banner {
      position: absolute;
      bottom: 80px;
      left: 0;
      background-color: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 8px 0;
      z-index: 90;
      width: 100%;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.6);
    }
    #banner-text {
      display: inline-block;
      white-space: nowrap;
      animation: scroll 12s linear infinite;
      font-size: 17px;
      padding-left: 100%;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* Popup */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .popup-content {
      background: #000;
      padding: 20px;
      width: 90%;
      max-width: 320px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #FF0000;
    }
    .close-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #FF0000;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }
    .join-btn {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 12px;
      background: #000;
      color: #FF0000;
      border: 2px solid #FF0000;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <!-- Shaka Player -->
    <div id="shaka-wrapper">
      <video id="video-element" autoplay playsinline preload="metadata" 
             poster="https://i.ibb.co/0mLQWV1/sportssnap-net.png"></video>
    </div>

    <!-- Iframe Fallback -->
    <div id="iframe-container" style="display: none;">
      <iframe id="external-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Sports Snap">
    
    <div id="running-banner">
      <div id="banner-text">Join Our Telegram channel @sportssnapofficial for more updates!! | www.sportssnap.net</div>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h2>Join Us!</h2>
      <p>Join Sports Snap Telegram for latest updates &amp; links</p>
      <a class="join-btn" href="https://t.me/sportssnapofficial" target="_blank">Join Now</a>
    </div>
  </div>

  <script>
    // Shaka Player Setup
    shaka.polyfill.installAll();

    const video = document.getElementById('video-element');
    const shakaWrapper = document.getElementById('shaka-wrapper');
    const iframeContainer = document.getElementById('iframe-container');
    const iframe = document.getElementById('external-iframe');

    async function loadStream() {
      const key = new URLSearchParams(window.location.search).get('sportssnap');
      if (!key) {
        console.error("Use ?sportssnap=barcelona");
        return;
      }

      try {
        const res = await fetch('https://sportssnap.github.io/playlist/stream.json');
        const data = await res.json();
        let stream = data[key];

        if (!stream) {
          console.error(`Stream not found for: ${key}`);
          return;
        }

        // If stream is string (simple HLS)
        if (typeof stream === 'string') {
          if (stream.includes('.m3u8')) {
            playWithShaka(stream, 'hls');
          } else if (stream.includes('.mpd')) {
            playWithShaka(stream, 'dash');
          } else {
            playIframe(stream);
          }
        } 
        // If stream is object (advanced with DRM)
        else if (typeof stream === 'object') {
          if (stream.iframe || stream.type === 'iframe') {
            playIframe(stream.url || stream.iframe);
          } else {
            playWithShaka(stream.url, stream.type || 'dash', stream.drm || null);
          }
        }
      } catch (e) {
        console.error("Failed to load playlist", e);
      }
    }

    async function playWithShaka(url, type = 'dash', drm = null) {
      iframeContainer.style.display = 'none';
      shakaWrapper.style.display = 'block';

      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, shakaWrapper, video);
      ui.configure({
        controlPanelElements: [
          'play_pause', 'time_and_duration', 'spacer', 
          'mute', 'volume', 'quality', 'fullscreen'
        ]
      });

      // Configure DRM if available
      if (drm && drm.clearKeys) {
        player.configure({
          drm: { clearKeys: drm.clearKeys }
        });
      }

      try {
        await player.load(url);
      } catch (error) {
        console.error("Shaka load error:", error);
      }
    }

    function playIframe(src) {
      shakaWrapper.style.display = 'none';
      iframeContainer.style.display = 'block';
      iframe.src = src;
    }

    // Double click fullscreen
    video.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Popup
    setTimeout(() => {
      document.querySelector('.popup').style.display = 'flex';
    }, 6000);

    document.querySelector('.close-btn').addEventListener('click', () => {
      document.querySelector('.popup').style.display = 'none';
    });

    // Start
    window.addEventListener('load', loadStream);
  </script>
</body>
</html>
