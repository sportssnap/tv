<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  function getQueryParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  const key = getQueryParameter('sportssnap'); // ?sportssnap=barcelona
  const video = document.getElementById('video');
  const videoContainer = document.getElementById('video-container');

  async function loadStream() {
    if (!key) {
      console.error("No sportssnap key provided in URL");
      return;
    }

    try {
      const response = await fetch("https://sportssnap.github.io/playlist/stream.json");
      const data = await response.json();

      const m3u8Url = data[key];

      if (!m3u8Url) {
        console.error("Stream key not found in JSON:", key);
        return;
      }

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(m3u8Url);
        hls.attachMedia(video);

        // fullscreen on double click
        video.addEventListener('dblclick', function () {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            videoContainer.requestFullscreen();
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m3u8Url;
      } else {
        console.error('HLS not supported');
      }

    } catch (err) {
      console.error("Error loading stream JSON:", err);
    }
  }

  loadStream();

  // Popup functionality (UNCHANGED)
  document.addEventListener('DOMContentLoaded', function() {
    let popupClosed = false;

    function showPopup() {
      if (!popupClosed) {
        document.querySelector('.popup').style.display = 'flex';
      }
    }

    setTimeout(showPopup, 6000);

    document.querySelector('.close-btn').addEventListener('click', function() {
      document.querySelector('.popup').style.display = 'none';
      popupClosed = true;
    });
  });
</script>
