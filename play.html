<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV - All Players</title>

  <!-- Plyr -->
  <script src="https://sportssnap.github.io/rth/plyr.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />

  <!-- DPlayer -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.26.0/dist/DPlayer.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/dplayer@1.26.0/dist/DPlayer.min.js"></script>

  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/8.21.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.21.0/video.min.js"></script>

  <!-- Shaka Player -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.14.0/dist/shaka-player.compiled.min.js"></script>

  <!-- Clappr -->
  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.plainhtml5.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #000; font-family: Arial, sans-serif; }
    #video-container {
      max-width: 1100px;
      margin: 20px auto;
      position: relative;
    }
    #player-wrapper { width: 100%; background: #000; }
    
    #logo {
      position: absolute; top: 15px; right: 15px; width: 65px; z-index: 100;
    }
    
    #running-banner {
      position: absolute; bottom: 70px; left: 0; width: 100%;
      background: rgba(0,0,0,0.8); color: white; padding: 10px 0;
      z-index: 90; text-align: center; overflow: hidden;
    }
    #banner-text {
      display: inline-block; white-space: nowrap; animation: scroll 18s linear infinite;
      font-size: 18px;
    }
    @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
    .popup-content {
      background: #111; padding: 30px; border-radius: 12px; text-align: center;
      border: 3px solid #FF0040; max-width: 340px; color: white;
    }
    .close-btn {
      position: absolute; top: -15px; right: -15px; background: #FF0040; color: white;
      border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 22px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <div id="player-wrapper"></div>
    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Logo">
    <div id="running-banner">
      <div id="banner-text">Join Our Telegram @sportssnapofficial for more updates!! | www.sportssnap.net</div>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h2>Join Us!</h2>
      <p>Join Sports Snap Telegram for latest streams & updates!</p>
      <a href="https://t.me/sportssnapofficial" target="_blank" class="join-btn" style="display:inline-block;padding:12px 24px;background:#000;color:#FF0040;border:2px solid #FF0040;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px;">JOIN TELEGRAM</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    function getQueryParameter(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const channelParam = Object.keys(Object.fromEntries(new URLSearchParams(location.search)))
      .find(k => k.includes('sportssnap'));

    const channel = getQueryParameter(channelParam);
    const playerType = channelParam ? channelParam.split('_')[0] : 'plyr1';

    let streamUrl = null;

    fetch('https://sportssnap.github.io/playlist/stream.json')
      .then(res => res.json())
      .then(data => {
        streamUrl = data[channel];
        if (!streamUrl) throw new Error("Channel not found");
        initPlayer();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('player-wrapper').innerHTML = 
          `<h2 style="color:red;text-align:center;padding:80px;">Stream not available or channel not found</h2>`;
      });

    function initPlayer() {
      const container = document.getElementById('player-wrapper');
      container.innerHTML = '';

      const isMpd = streamUrl.toLowerCase().includes('.mpd');

      switch(playerType) {
        case 'plyr1':
        case 'plyr2':
          initPlyr(container);
          break;
        case 'dplayer':
          initDPlayer(container);
          break;
        case 'videojs':
          initVideoJS(container);
          break;
        case 'shaka':
          initShaka(container);
          break;
        case 'hls':
          initHlsNative(container);
          break;
        case 'jw':
          initJWPlayer(container);
          break;
        case 'clappr':
          initClappr(container);
          break;
        default:
          initPlyr(container);
      }
    }

    // ==================== 1. PLYR ====================
    function initPlyr(container) {
      container.innerHTML = `<video id="plyr-video" class="plyr__video-embed" controls playsinline></video>`;
      const video = document.getElementById('plyr-video');
      setupHls(video);
      new Plyr(video, { controls: ['play','progress','current-time','duration','mute','volume','fullscreen','pip','settings'], settings: ['quality','speed'] });
    }

    // ==================== 2. DPLAYER ====================
    function initDPlayer(container) {
      container.innerHTML = `<div id="dplayer" style="width:100%;height:560px;"></div>`;
      new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: true,
        video: { url: streamUrl, type: isMpd ? 'dash' : 'hls' }
      });
    }

    // ==================== 3. VIDEO.JS ====================
    function initVideoJS(container) {
      container.innerHTML = `<video id="videojs-player" class="video-js vjs-default-skin" controls playsinline></video>`;
      const player = videojs('videojs-player', {
        fluid: true,
        autoplay: true,
        controls: true,
        sources: [{ src: streamUrl, type: isMpd ? 'application/dash+xml' : 'application/x-mpegURL' }]
      });
    }

    // ==================== 4. SHAKA PLAYER (Best for MPD) ====================
    function initShaka(container) {
      container.innerHTML = `<video id="shaka-video" controls autoplay style="width:100%;height:560px;"></video>`;
      const video = document.getElementById('shaka-video');
      const player = new shaka.Player(video);
      
      player.load(streamUrl).then(() => {
        console.log('Shaka Player loaded successfully');
      }).catch(err => console.error('Shaka Error:', err));
    }

    // ==================== 5. HLS Native ====================
    function initHlsNative(container) {
      container.innerHTML = `<video id="hls-video" controls style="width:100%;height:560px;"></video>`;
      const video = document.getElementById('hls-video');
      setupHls(video);
    }

    function setupHls(video) {
      if (Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }
    }

    // ==================== 6. JW PLAYER ====================
    function initJWPlayer(container) {
      container.innerHTML = `<div id="jwplayer" style="width:100%;height:560px;"></div>`;
      jwplayer('jwplayer').setup({
        file: streamUrl,
        width: "100%",
        height: "100%",
        autostart: true,
        controls: true
      });
    }

    // ==================== 7. CLAPPR ====================
    function initClappr(container) {
      container.innerHTML = `<div id="clappr-player" style="width:100%;height:560px;"></div>`;
      new Clappr.Player({
        source: streamUrl,
        parentId: '#clappr-player',
        height: '100%',
        width: '100%',
        autoplay: true
      });
    }

    // Popup
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('popup').style.display = 'flex';
      }, 6500);

      document.querySelector('.close-btn').addEventListener('click', () => {
        document.getElementById('popup').style.display = 'none';
      });
    });
  </script>
</body>
</html>
