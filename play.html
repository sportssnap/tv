<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Snap TV</title>

  <!-- ── JW Player ── -->
  <script src="https://content.jwplatform.com/libraries/KB5zFt7A.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hola.org/jwplayer-hlsjs@latest/dist/jwplayer.hlsjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17"></script>

  <!-- ── Shaka Player ── -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.ui.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap');

    :root { --red:#e8001d; --gray:rgba(255,255,255,0.55); }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:#000; overflow:hidden;
      font-family:'Barlow', sans-serif;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }

    #player-shell {
      position:relative; width:100%; height:100%;
      background:#000; overflow:hidden;
    }

    /* ══ JW wrapper ══ */
    #jw-wrapper {
      position:absolute; inset:0;
      background:#000; display:none;
    }
    #jw-wrapper.active { display:block; }

    #jw-player-el { width:100% !important; height:100% !important; }

    /* ── Iframe fallback inside JW ── */
    #iframe-el {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:none; background:#000;
      display:none; z-index:5;
    }

    /* ── Iframe overlay ── */
    #iframe-overlay {
      display:none; position:absolute; inset:0;
      z-index:20; pointer-events:none;
    }
    #iframe-overlay.active { display:block; }

    #iframe-overlay .ov-logo {
      position:absolute; top:15px; left:20px; pointer-events:none;
    }
    #iframe-overlay .ov-logo img {
      width:120px; height:auto; display:block;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.7));
    }
    #iframe-overlay .ov-fs-btn {
      position:absolute; bottom:10px; right:10px;
      pointer-events:all;
      width:44px; height:44px;
      background:rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.25);
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .15s;
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      touch-action:manipulation;
    }
    #iframe-overlay .ov-fs-btn:hover,
    #iframe-overlay .ov-fs-btn:active { background:rgba(232,0,29,0.6); border-color:var(--red); }
    #iframe-overlay .ov-fs-btn svg { width:22px; height:22px; fill:#fff; }

    @media (hover:none) and (pointer:coarse) {
      #iframe-overlay .ov-fs-btn { width:52px; height:52px; bottom:14px; right:14px; background:rgba(0,0,0,0.75); border-color:rgba(232,0,29,0.6); }
      #iframe-overlay .ov-fs-btn svg { width:26px; height:26px; }
      #iframe-overlay .ov-logo img { width:80px; }
    }

    /* ══ Shaka wrapper ══ */
    #shaka-wrapper {
      position:absolute; inset:0;
      background:#000; display:none;
    }
    #shaka-wrapper.active { display:block; }

    #shaka-container {
      position:relative; width:100%; height:100%;
    }
    #shaka-video {
      width:100%; height:100%;
      background:#000; display:block;
    }

    /* Shaka red theme */
    .shaka-controls-container { --shaka-highlight-color:#e8001d !important; }
    .shaka-play-button { background-color:rgba(232,0,29,0.85) !important; }
    .shaka-range-element::-webkit-slider-thumb { background:#e8001d !important; }
    .shaka-range-element::-moz-range-thumb { background:#e8001d !important; }

    /* Shaka branding overlay */
    #shaka-brand {
      position:absolute; inset:0;
      pointer-events:none; z-index:10;
    }
    #shaka-logo {
      position:absolute; top:12px; right:14px;
      pointer-events:all;
    }
    #shaka-logo a { display:block; text-decoration:none; }
    #shaka-logo img {
      width:100px; height:auto; display:block;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.8));
      opacity:0.92;
    }
    #shaka-label {
      position:absolute; left:0; right:0; bottom:62px;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    #shaka-label span {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px; font-weight:700;
      letter-spacing:2.5px; text-transform:uppercase;
      color:rgba(255,255,255,0.75);
      text-shadow:0 1px 6px rgba(0,0,0,0.9);
    }
    #shaka-label span em { font-style:normal; color:var(--red); }

    /* ══ SITE LABEL (JW/iframe mode) ══ */
    #site-bar {
      position:absolute; left:0; right:0; bottom:62px;
      display:flex; align-items:center; justify-content:center;
      z-index:9999; pointer-events:none;
    }
    #site-bar span {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px; font-weight:700;
      letter-spacing:2.5px; text-transform:uppercase;
      color:rgba(255,255,255,0.75);
      text-shadow:0 1px 6px rgba(0,0,0,0.9);
    }
    #site-bar span em { font-style:normal; color:var(--red); }

    /* ══ Loader ══ */
    #loader {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#000; z-index:50; gap:16px;
      transition:opacity 0.4s;
    }
    #loader.hidden { opacity:0; pointer-events:none; }
    .spinner-ring {
      width:48px; height:48px;
      border:3px solid rgba(255,255,255,0.08);
      border-top-color:var(--red);
      border-radius:50%;
      animation:spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #loader p {
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px; letter-spacing:2px;
      text-transform:uppercase; color:var(--gray);
    }

    /* ══ Error ══ */
    #error-msg {
      position:absolute; inset:0;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:10px; z-index:48;
    }
    #error-msg.show { display:flex; }
    #error-msg svg { width:40px; height:40px; fill:var(--red); opacity:0.7; }
    #error-msg p {
      font-family:'Barlow Condensed',sans-serif;
      font-size:14px; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--gray);
    }

    /* ══ Telegram FAB ══ */
    #tg-fab {
      display:flex; position:absolute;
      bottom:70px; right:16px; z-index:9999;
      width:52px; height:52px; border-radius:50%;
      background:#0088cc;
      align-items:center; justify-content:center;
      text-decoration:none;
      box-shadow:0 2px 12px rgba(0,136,204,0.5);
      animation:tg-pulse 1.5s ease-out infinite;
    }
    #tg-fab svg { fill:#fff; width:26px; height:26px; }
    @keyframes tg-pulse {
      0%   { box-shadow:0 0 0 0 rgba(0,136,204,0.55); }
      80%  { box-shadow:0 0 0 14px rgba(0,136,204,0); }
      100% { box-shadow:0 0 0 0 rgba(0,136,204,0); }
    }

    /* ══ Fullscreen ══ */
    #player-shell:fullscreen,
    #player-shell:-webkit-full-screen,
    #player-shell:-moz-full-screen {
      width:100vw !important; height:100vh !important;
    }
  </style>
</head>
<body>

<div id="player-shell">

  <!-- ══ JW Player wrapper ══ -->
  <div id="jw-wrapper">
    <div id="jw-player-el">Loading player…</div>
    <iframe id="iframe-el" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    <div id="iframe-overlay">
      <div class="ov-logo">
        <img src="https://i.ibb.co/0mLQWV1/sportssnap-net.png" alt="Sports Snap" onerror="this.style.display='none'">
      </div>
      <button class="ov-fs-btn" id="iframe-fs-btn" title="Fullscreen">
        <svg id="iframe-fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <!-- ══ Shaka Player wrapper ══ -->
  <div id="shaka-wrapper">
    <div id="shaka-container" data-shaka-player-container>
      <video id="shaka-video" data-shaka-player autoplay playsinline></video>
    </div>
    <div id="shaka-brand">
      <div id="shaka-logo">
        <a href="https://www.sportssnap.net" target="_blank" rel="noopener">
          <img src="https://i.ibb.co/0mLQWV1/sportssnap-net.png" alt="Sports Snap" onerror="this.style.display='none'">
        </a>
      </div>
      <div id="shaka-label"><span><em>sports</em>snap.net</span></div>
    </div>
  </div>

  <!-- Site label (JW/iframe only) -->
  <div id="site-bar"><span><em>sports</em>snap.net</span></div>

  <!-- Loader / Error -->
  <div id="loader"><div class="spinner-ring"></div><p>Loading stream…</p></div>
  <div id="error-msg">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <p>Stream unavailable</p>
  </div>

  <!-- Telegram FAB -->
  <a id="tg-fab" href="https://t.me/sportssnapofficial" target="_blank" rel="noopener" title="Join Telegram">
    <svg viewBox="0 0 64 64"><path d="M56.4,8.2l-51.2,20c-1.7,0.6-1.6,3,0.1,3.5l9.7,2.9c2.1,0.6,3.8,2.2,4.4,4.3l3.8,12.1c0.5,1.6,2.5,2.1,3.7,0.9l5.2-5.3c0.9-0.9,2.2-1,3.2-0.3l11.5,8.4c1.6,1.2,3.9,0.3,4.3-1.7l8.7-41.8C60.4,9.1,58.4,7.4,56.4,8.2z M50,17.4L29.4,35.6c-1.1,1-1.9,2.4-2,3.9c-0.2,1.5-2.3,1.7-2.8,0.3l-0.9-3c-0.7-2.2,0.2-4.5,2.1-5.7l23.5-14.6C49.9,16.1,50.5,16.9,50,17.4z"/></svg>
  </a>

</div><!-- /player-shell -->

<script>
(function () {
  'use strict';

  const shell         = document.getElementById('player-shell');
  const jwWrapper     = document.getElementById('jw-wrapper');
  const shakaWrapper  = document.getElementById('shaka-wrapper');
  const iframeEl      = document.getElementById('iframe-el');
  const iframeOverlay = document.getElementById('iframe-overlay');
  const iframeFsBtn   = document.getElementById('iframe-fs-btn');
  const iframeFsIcon  = document.getElementById('iframe-fs-icon');
  const loader        = document.getElementById('loader');
  const errorMsg      = document.getElementById('error-msg');
  const siteBar       = document.getElementById('site-bar');

  const FS_ENTER = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
  const FS_EXIT  = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

  function showLoader(v) { loader.classList.toggle('hidden', !v); }
  function showError(msg) {
    showLoader(false);
    errorMsg.classList.add('show');
    if (msg) errorMsg.querySelector('p').textContent = msg;
  }

  /* ── Parse params: support ?sportssnap=, ?jw-sportssnap=, ?shaka-sportssnap= ── */
  function getParam(name) {
    const m = new RegExp('[?&]' + name.replace(/[\[\]]/g,'\\$&') + '=([^&#]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
  }

  const jwKey    = getParam('jw-sportssnap');
  const shakaKey = getParam('shaka-sportssnap');
  const legacyKey= getParam('sportssnap');

  const mode = jwKey ? 'jw' : shakaKey ? 'shaka' : 'jw';
  const key  = jwKey || shakaKey || legacyKey;

  function detectType(url) {
    if (!url) return 'unknown';
    const u = url.toLowerCase().split('?')[0];
    if (u.endsWith('.m3u8')) return 'hls';
    if (u.endsWith('.mpd'))  return 'dash';
    return 'iframe';
  }

  /* ══════════════════════════════════════════
     JW — iframe fallback
  ══════════════════════════════════════════ */
  function loadIframe(url, sandbox) {
    document.getElementById('jw-player-el').style.display = 'none';
    iframeEl.style.display = 'block';
    sandbox
      ? iframeEl.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation allow-orientation-lock')
      : iframeEl.removeAttribute('sandbox');
    iframeEl.src = url;
    iframeOverlay.classList.add('active');
    showLoader(false);
  }

  /* ══════════════════════════════════════════
     JW — native HLS/DASH
  ══════════════════════════════════════════ */
  function initJW(url, type, drmConfig, meta) {
    showLoader(true);
    errorMsg.classList.remove('show');
    jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

    const sources = [];
    if (type === 'hls')       sources.push({ file:url, type:'hls',  label:'HLS',  default:true });
    else if (type === 'dash') sources.push({ file:url, type:'dash', label:'DASH', default:true });
    else                      sources.push({ file:url, default:true });

    const setup = {
      playlist:[{ title:meta.title||'', description:'Sports Snap Live',
        image:meta.image||'https://i.ibb.co/0mLQWV1/sportssnap-net.png', sources }],
      width:'100%', height:'100%', autostart:true, mute:false, cast:{},
      logo:{ file:'https://i.ibb.co/0mLQWV1/sportssnap-net.png',
             link:'https://www.sportssnap.net', position:'top-right' },
      skin:{ name:'netflix' },
      sharing:{ link:'https://t.me/sportssnapofficial' },
      hlsjsConfig:{ debug:false, p2pConfig:{ live:true } }
    };
    if (drmConfig) setup.drm = drmConfig;

    const player = jwplayer('jw-player-el');
    player.setup(setup);
    player.on('ready',      () => showLoader(false));
    player.on('error',      (e) => { console.error('JW Error:', e); showError('Stream unavailable'); });
    player.on('setupError', (e) => { console.error('JW Setup:', e); showError('Stream unavailable'); });
  }

  /* ══════════════════════════════════════════
     SHAKA
  ══════════════════════════════════════════ */
  async function initShaka(url, drmConfig) {
    showLoader(true);
    errorMsg.classList.remove('show');

    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { showError('Browser not supported'); return; }

    const video     = document.getElementById('shaka-video');
    const container = document.getElementById('shaka-container');
    const ui        = new shaka.ui.Overlay(null, container, video);
    const player    = ui.getPlayer();

    ui.configure({
      addSeekBar: true,
      addBigPlayButton: true,
      controlPanelElements: ['play_pause','time_and_duration','spacer','mute','volume','fullscreen'],
      overflowMenuButtons: ['quality','captions','playback_rate'],
      fadeDelay: 3
    });

    player.addEventListener('error', (e) => {
      console.error('Shaka error', e.detail);
      showError('Stream unavailable');
    });

    if (drmConfig) {
      if (drmConfig.clearkey) {
        player.configure({ drm:{ clearKeys:{ [drmConfig.clearkey.keyId]: drmConfig.clearkey.key } } });
      } else {
        player.configure({ drm: drmConfig });
      }
    }

    try {
      await player.load(url);
      video.play();
      showLoader(false);
    } catch (err) {
      console.error('Shaka load error', err);
      showError('Stream unavailable');
    }
  }

  /* ══════════════════════════════════════════
     MAIN LOADER
  ══════════════════════════════════════════ */
  async function loadStream() {
    if (!key) { showLoader(false); showError('No stream key provided'); return; }

    showLoader(true);

    /* Activate the correct wrapper */
    if (mode === 'shaka') {
      shakaWrapper.classList.add('active');
      siteBar.style.display = 'none'; /* Shaka has its own label */
    } else {
      jwWrapper.classList.add('active');
      siteBar.style.display = 'flex';
    }

    try {
      const data   = await (await fetch('https://sportssnap.github.io/playlist/stream.json')).json();
      const stream = data[key];
      if (!stream) { showError('Stream unavailable'); return; }

      let url, drmConfig = null, type, sandboxFlag = false;
      const meta = { title:'', image:'' };

      if (typeof stream === 'string') {
        url  = stream;
        type = detectType(url);
      } else {
        url          = stream.url || stream.iframe || '';
        meta.title   = stream.title  || '';
        meta.image   = stream.image  || '';
        if (stream.drm && stream.drm.clearKeys) {
          const [[kId, k]] = Object.entries(stream.drm.clearKeys);
          drmConfig = { clearkey:{ keyId:kId, key:k } };
        } else if (stream.drm) {
          drmConfig = stream.drm;
        }
        sandboxFlag = stream.sandbox || false;
        type = (stream.iframe || stream.type === 'iframe') ? 'iframe' : detectType(url);
      }

      if (mode === 'shaka') {
        if (type === 'iframe') {
          /* Shaka fallback: show iframe directly inside shaka wrapper */
          const ifr = document.createElement('iframe');
          ifr.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;background:#000;z-index:5;';
          ifr.allowFullscreen = true;
          ifr.src = url;
          document.getElementById('shaka-container').appendChild(ifr);
          showLoader(false);
        } else {
          initShaka(url, drmConfig);
        }
      } else {
        if (type === 'iframe') loadIframe(url, sandboxFlag);
        else                   initJW(url, type, drmConfig, meta);
      }

    } catch (err) {
      console.error(err);
      showError('Stream unavailable');
    }
  }

  /* ══════════════════════════════════════════
     FULLSCREEN
  ══════════════════════════════════════════ */
  function goFullscreen() {
    const el = shell;
    if      (el.requestFullscreen)       el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
    if (screen.orientation && screen.orientation.lock)
      screen.orientation.lock('landscape').catch(() => {});
  }
  function exitFullscreen() {
    if      (document.exitFullscreen)       document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  }

  iframeFsBtn.addEventListener('click', () => isFullscreen() ? exitFullscreen() : goFullscreen());

  document.addEventListener('click', (e) => {
    const fsBtn = e.target.closest('.jw-icon-fullscreen, [aria-label="Fullscreen"], [aria-label="Exit Fullscreen"]');
    if (!fsBtn) return;
    e.preventDefault(); e.stopPropagation();
    isFullscreen() ? exitFullscreen() : goFullscreen();
  }, true);

  function onFsChange() {
    if (!isFullscreen() && screen.orientation && screen.orientation.unlock)
      screen.orientation.unlock();
    const path = iframeFsIcon.querySelector('path');
    if (path) path.setAttribute('d', isFullscreen() ? FS_EXIT : FS_ENTER);
  }
  document.addEventListener('fullscreenchange',       onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('mozfullscreenchange',    onFsChange);

  /* Boot */
  window.addEventListener('load', loadStream);
})();
</script>
</body>
</html>
