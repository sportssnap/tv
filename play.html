<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sports Snap TV</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial,sans-serif;
}

#video-container{
    position:relative;
    width:100%;
    max-width:100%;
    margin:auto;
    background:#000;
}

#video{
    width:100%;
    height:100vh;
    background:#000;
}

#logo{
    position:absolute;
    top:10px;
    right:10px;
    width:60px;
    z-index:100;
}

#running-banner{
    position:absolute;
    bottom:80px;
    left:0;
    width:100%;
    overflow:hidden;
    background:rgba(0,0,0,.7);
    color:#fff;
    z-index:100;
    padding:6px 0;
}

#banner-text{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 15s linear infinite;
    font-size:16px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

.loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:20px;
    z-index:999;
}

.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.popup-content{
    width:90%;
    max-width:320px;
    background:#000;
    color:#fff;
    border:2px solid red;
    border-radius:10px;
    padding:15px;
    text-align:center;
    position:relative;
}

.close-btn{
    position:absolute;
    top:-8px;
    right:-8px;
    width:25px;
    height:25px;
    border:none;
    border-radius:50%;
    background:red;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.join-btn{
    display:inline-block;
    margin-top:10px;
    padding:8px 15px;
    border:2px solid red;
    border-radius:10px;
    text-decoration:none;
    color:red;
    font-weight:bold;
}

.error{
    color:red;
    text-align:center;
    padding:20px;
    font-size:18px;
}
</style>

</head>

<body>

<div id="video-container">

<div id="loading" class="loading">
Loading Stream...
</div>

<video
id="video"
playsinline
controls
poster="https://i.ibb.co/0mLQWV1/sportssnap-net.png"> </video>

<img
id="logo"
src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png"
alt="Sports Snap">

<div id="running-banner">
<div id="banner-text">
Join Our Telegram Channel @sportssnapofficial For More Updates!! | www.sportssnap.net
</div>
</div>

</div>

<div class="popup">

<div class="popup-content">

<button class="close-btn">×</button>

<h2>Join Us!</h2>

<p>
Join Sports Snap Telegram Channel For More Updates!
</p>

<a
class="join-btn"
href="https://t.me/sportssnapofficial"
target="_blank">
Join Now </a>

</div>

</div>

<script>

const video = document.getElementById('video');
const loading = document.getElementById('loading');

function getQueryParameter(name){
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const channel = getQueryParameter('sportssnap');

if(!channel){
    loading.innerHTML = 'No Channel Selected';
}else{

fetch('https://sportssnap.github.io/playlist/stream.json?' + Date.now())

.then(response => response.json())

.then(data => {

    const streamUrl = data[channel];

    if(!streamUrl){

        loading.innerHTML = 'Channel Not Found';
        return;
    }

    loading.style.display = 'none';

    const lowerUrl = streamUrl.toLowerCase();

    if(lowerUrl.includes('.m3u8')){

        if(Hls.isSupported()){

            const hls = new Hls({
                enableWorker:true,
                lowLatencyMode:true
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED,function(){

                new Plyr(video,{
                    fullscreen:{
                        enabled:true,
                        fallback:true,
                        iosNative:true
                    }
                });

            });

        }else if(video.canPlayType('application/vnd.apple.mpegurl')){

            video.src = streamUrl;

            new Plyr(video);

        }

    }

    else if(lowerUrl.includes('.mpd')){

        dashjs.MediaPlayer()
        .create()
        .initialize(video,streamUrl,true);

        new Plyr(video,{
            fullscreen:{
                enabled:true,
                fallback:true,
                iosNative:true
            }
        });

    }

    else{

        video.src = streamUrl;

        new Plyr(video);
    }

})

.catch(error => {

    console.error(error);

    loading.innerHTML =
    '<div class="error">Failed To Load Stream</div>';

});

}

video.addEventListener('dblclick',function(){

    const container =
    document.getElementById('video-container');

    if(document.fullscreenElement){

        document.exitFullscreen();

    }else{

        container.requestFullscreen();

    }

});

document.addEventListener('DOMContentLoaded',function(){

    let popupClosed = false;

    function showPopup(){

        if(!popupClosed){

            document.querySelector('.popup').style.display='flex';

        }

    }

    setTimeout(showPopup,6000);

    document
    .querySelector('.close-btn')
    .addEventListener('click',function(){

        document.querySelector('.popup').style.display='none';

        popupClosed = true;

    });

});

</script>

</body>
</html>
