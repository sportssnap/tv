<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Snap TV - Shaka UI Player</title>

<!-- Shaka Player UI -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player/dist/controls.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player/dist/shaka-player.ui.js"></script>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial;
}

#video-container {
    width: 100%;
    height: 100vh;
    position: relative;
    background: black;
}

/* Shaka UI fills screen */
.shaka-video-container {
    width: 100%;
    height: 100%;
}

#logo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 50px;
    z-index: 10;
}

#running-banner {
    position: absolute;
    bottom: 70px;
    width: 100%;
    color: white;
    background: rgba(0,0,0,0.6);
    overflow: hidden;
    z-index: 5;
}

#banner-text {
    white-space: nowrap;
    display: inline-block;
    padding-left: 100%;
    animation: scroll 12s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    z-index: 100;
}
</style>
</head>

<body>

<div id="video-container">

<div id="loading" class="loading">Loading...</div>

<!-- Video Element -->
<video id="video" autoplay playsinline></video>

<img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png">

<div id="running-banner">
<div id="banner-text">
Join @sportssnapofficial | www.sportssnap.net
</div>
</div>

</div>

<script>

// ---------------- GET PARAM ----------------
function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
}

// ---------------- INIT SHAKA UI ----------------
async function initPlayer(){

    const video = document.getElementById('video');

    if (!shaka.Player.isBrowserSupported()) {
        document.getElementById('loading').innerText = "Browser Not Supported";
        return;
    }

    shaka.polyfill.installAll();

    const player = new shaka.Player(video);

    // 🔥 UI CONTROLS
    const ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);

    const config = {
        controlPanelElements: [
            'play_pause',
            'time_and_duration',
            'spacer',
            'mute',
            'volume',
            'fullscreen',
            'overflow_menu'
        ],
        overflowMenuButtons: [
            'quality',
            'playback_rate',
            'picture_in_picture'
        ]
    };

    ui.configure(config);

    player.addEventListener('error', (e) => {
        console.error(e);
    });

    const channel = getParam('shaka_sportssnap');

    if(!channel){
        document.getElementById('loading').innerText = "No Channel Selected";
        return;
    }

    fetch('https://sportssnap.github.io/playlist/stream.json')
    .then(res => res.json())
    .then(async data => {

        const streamUrl = data[channel];

        if(!streamUrl){
            document.getElementById('loading').innerText = "Channel Not Found";
            return;
        }

        try {
            await player.load(streamUrl);
            document.getElementById('loading').style.display = "none";
        } catch (err) {
            console.error(err);
            document.getElementById('loading').innerText = "Stream Failed";
        }

    });

}

document.addEventListener('DOMContentLoaded', initPlayer);

</script>

</body>
</html>
