<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Snap TV</title>

<script src="https://sportssnap.github.io/rth/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#000;
}

#video-container{
    position:relative;
    width:100%;
    max-width:800px;
    margin:auto;
    aspect-ratio:16/9;
}

#video{
    width:100%;
    height:100%;
}

#logo{
    position:absolute;
    top:10px;
    right:10px;
    width:50px;
    z-index:10;
}

#running-banner{
    position:absolute;
    bottom:60px;
    left:0;
    width:100%;
    background:rgba(0,0,0,.7);
    color:#fff;
    overflow:hidden;
    z-index:20;
    padding:5px 0;
}

#banner-text{
    display:inline-block;
    white-space:nowrap;
    animation:scroll 15s linear infinite;
    padding-left:100%;
    font-size:18px;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:#000;
    color:#fff;
    width:80%;
    max-width:300px;
    padding:15px;
    border-radius:10px;
    border:2px solid red;
    text-align:center;
    position:relative;
}

.close-btn{
    position:absolute;
    top:-8px;
    right:-8px;
    width:24px;
    height:24px;
    border:none;
    border-radius:50%;
    background:red;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.join-btn{
    display:inline-block;
    margin-top:10px;
    padding:8px 15px;
    border:2px solid red;
    border-radius:12px;
    text-decoration:none;
    color:red;
    font-weight:bold;
}

#video-container:fullscreen #logo,
#video-container:-webkit-full-screen #logo{
    width:100px;
}

.loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    z-index:100;
    font-size:18px;
}
</style>
</head>

<body>

<div id="video-container">

    <div class="loading" id="loading">
        Loading Stream...
    </div>

    <video
        id="video"
        controls
        playsinline
        poster="https://i.ibb.co/0mLQWV1/sportssnap-net.png">
    </video>

    <img
        id="logo"
        src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png"
        alt="Logo">

    <div id="running-banner">
        <div id="banner-text">
            Join Our Telegram Channel @sportssnapofficial For More Updates!! | www.sportssnap.net
        </div>
    </div>

</div>

<div class="popup">
    <div class="popup-content">
        <button class="close-btn">×</button>
        <h2>Join Us!</h2>
        <p>Join Sports Snap Telegram Channel For More Updates.</p>
        <a class="join-btn"
           href="https://t.me/sportssnapofficial"
           target="_blank">
           Join Now
        </a>
    </div>
</div>

<script>

const video = document.getElementById("video");
const loading = document.getElementById("loading");

function getParameter(name){
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

const channel = getParameter("sportssnap");

if(channel){

    fetch("https://sportssnap.github.io/playlist/stream.json?t=" + Date.now())
    .then(response => response.json())
    .then(data => {

        const streamUrl = data[channel];

        if(!streamUrl){
            loading.innerHTML = "Channel Not Found";
            return;
        }

        loading.style.display = "none";

        if(Hls.isSupported()){

            const hls = new Hls({
                enableWorker:true
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function(){
                video.play().catch(()=>{});
            });

        }else if(video.canPlayType("application/vnd.apple.mpegurl")){

            video.src = streamUrl;

            video.addEventListener("loadedmetadata",function(){
                video.play().catch(()=>{});
            });

        }else{
            loading.innerHTML = "HLS Not Supported";
        }

    })
    .catch(error => {
        console.error(error);
        loading.innerHTML = "Failed To Load Playlist";
    });

}else{
    loading.innerHTML = "No Channel Selected";
}

video.addEventListener("dblclick",function(){

    const container = document.getElementById("video-container");

    if(document.fullscreenElement){
        document.exitFullscreen();
    }else{
        container.requestFullscreen();
    }

});

document.addEventListener("DOMContentLoaded",function(){

    let popupClosed = false;

    function showPopup(){
        if(!popupClosed){
            document.querySelector(".popup").style.display = "flex";
        }
    }

    setTimeout(showPopup,6000);

    document.querySelector(".close-btn").addEventListener("click",function(){
        document.querySelector(".popup").style.display = "none";
        popupClosed = true;
    });

});
</script>

</body>
</html>
