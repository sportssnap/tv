<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Snap TV</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.ui.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap');

    :root { --red: #e8001d; --gray: rgba(255,255,255,0.55); }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:#000; overflow:hidden;
      font-family:'Barlow', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #player-shell {
      position:relative; width:100%; height:100%;
      background:#000; overflow:hidden;
    }

    /* ── Shaka ── */
    #shaka-container {
      position:absolute; inset:0;
      width:100%; height:100%;
      background:#000;
    }
    #shaka-video {
      width:100%; height:100%;
      background:#000; display:block;
    }
    #shaka-container .shaka-video-container,
    #shaka-container video {
      width:100% !important;
      height:100% !important;
    }

    /* Red accent */
    .shaka-controls-container { --shaka-highlight-color:#e8001d !important; }
    .shaka-play-button { background-color:rgba(232,0,29,0.85) !important; }
    .shaka-range-element::-webkit-slider-thumb { background:#e8001d !important; }
    .shaka-range-element::-moz-range-thumb     { background:#e8001d !important; }

    /* ── Iframe fallback ── */
    #iframe-el {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:none; background:#000;
      display:none; z-index:5;
    }
    #iframe-overlay {
      display:none; position:absolute; inset:0;
      z-index:20; pointer-events:none;
    }
    #iframe-overlay.active { display:block; }
    #iframe-overlay .ov-logo {
      position:absolute; top:15px; left:20px; pointer-events:none;
    }
    #iframe-overlay .ov-logo img {
      width:120px; height:auto; display:block;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.7));
    }
    #iframe-overlay .ov-fs-btn {
      position:absolute; bottom:10px; right:10px;
      pointer-events:all;
      width:44px; height:44px;
      background:rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.25); border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .15s;
      backdrop-filter:blur(6px); touch-action:manipulation;
    }
    #iframe-overlay .ov-fs-btn:hover,
    #iframe-overlay .ov-fs-btn:active { background:rgba(232,0,29,0.6); border-color:var(--red); }
    #iframe-overlay .ov-fs-btn svg { width:22px; height:22px; fill:#fff; }

    #ov-right-zone { display:none; }
    @media (hover:none) and (pointer:coarse) {
      #ov-right-zone { display:block; position:absolute; top:0; right:0; width:100px; height:100%; pointer-events:none; z-index:30; }
      #iframe-overlay .ov-fs-btn { width:52px; height:52px; bottom:14px; right:14px; background:rgba(0,0,0,0.75); border-color:rgba(232,0,29,0.6); }
      #iframe-overlay .ov-fs-btn svg { width:26px; height:26px; }
      #iframe-overlay .ov-logo img { width:80px; }
    }

    /* ── Logo top-right (bigger) ── */
    #brand-logo {
      position:absolute; top:12px; right:14px;
      z-index:500; pointer-events:all;
    }
    #brand-logo a { display:block; text-decoration:none; }
    #brand-logo img {
      width:148px; height:auto; display:block;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.8));
      opacity:0.92; transition:opacity .2s;
    }
    #brand-logo img:hover { opacity:1; }
    #brand-logo.hidden { display:none; }
    @media (hover:none) and (pointer:coarse) { #brand-logo img { width:108px; } }

    /* ── Site label ── */
    #site-bar {
      position:absolute; left:0; right:0; bottom:62px;
      display:flex; align-items:center; justify-content:center;
      z-index:9999; pointer-events:none;
    }
    #site-bar span {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px; font-weight:700;
      letter-spacing:2.5px; text-transform:uppercase;
      color:rgba(255,255,255,0.75);
      text-shadow:0 1px 6px rgba(0,0,0,0.9);
    }
    #site-bar span em { font-style:normal; color:var(--red); }

    /* ══ LOADING BANNER — shown while video loads ══ */
    #load-banner {
      position:absolute; inset:0; z-index:8000;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background: radial-gradient(ellipse at center, #0d0d0d 0%, #000 70%);
      transition: opacity .55s ease;
    }
    #load-banner.hiding  { opacity:0; pointer-events:none; }
    #load-banner.gone    { display:none; }

    /* Subtle animated grid */
    #load-banner::before {
      content:''; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(232,0,29,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,0,29,0.04) 1px, transparent 1px);
      background-size:40px 40px;
      animation:grid-drift 20s linear infinite;
    }
    @keyframes grid-drift { from{background-position:0 0} to{background-position:40px 40px} }

    /* Red sweep line at top */
    #load-banner::after {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg, transparent, #e8001d, transparent);
      animation:bar-sweep 2.5s ease-in-out infinite;
    }
    @keyframes bar-sweep { 0%,100%{opacity:.4} 50%{opacity:1} }

    #lb-logo {
      width:190px; height:auto; position:relative; z-index:1;
      filter:drop-shadow(0 4px 36px rgba(232,0,29,0.65));
      animation:logo-pulse 2.2s ease-in-out infinite;
      margin-bottom:32px;
    }
    @keyframes logo-pulse {
      0%,100%{ filter:drop-shadow(0 4px 24px rgba(232,0,29,0.4)); transform:scale(1); }
      50%    { filter:drop-shadow(0 4px 52px rgba(232,0,29,0.9)); transform:scale(1.045); }
    }

    #lb-spinner-wrap {
      position:relative; z-index:1;
      display:flex; flex-direction:column; align-items:center; gap:14px;
    }
    .lb-ring {
      width:52px; height:52px;
      border:3px solid rgba(255,255,255,0.08); border-top-color:#e8001d;
      border-radius:50%; animation:spin .85s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    #lb-text {
      font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700;
      letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.45);
    }
    #lb-text em { font-style:normal; color:#e8001d; }

    /* ── Loader (behind banner) ── */
    #loader {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#000; z-index:400; gap:16px;
      transition:opacity .4s;
    }
    #loader.hidden { opacity:0; pointer-events:none; }
    .spinner-ring {
      width:48px; height:48px;
      border:3px solid rgba(255,255,255,0.08);
      border-top-color:var(--red); border-radius:50%;
      animation:spin .9s linear infinite;
    }
    #loader p {
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px; letter-spacing:2px;
      text-transform:uppercase; color:var(--gray);
    }

    /* ── Error ── */
    #error-msg {
      position:absolute; inset:0;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:10px; z-index:48;
    }
    #error-msg.show { display:flex; }
    #error-msg svg { width:40px; height:40px; fill:var(--red); opacity:.7; }
    #error-msg p {
      font-family:'Barlow Condensed',sans-serif;
      font-size:14px; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--gray);
    }

    /* ── Popup — desktop only ── */
    #popup {
      display:none; position:absolute; inset:0;
      background:rgba(0,0,0,0.82); z-index:99999;
      align-items:center; justify-content:center;
      backdrop-filter:blur(4px);
    }
    @media (hover:hover) and (pointer:fine) { #popup.show { display:flex; } }
    .popup-box {
      background:#111; border:1px solid var(--red); border-radius:16px;
      padding:28px 24px 22px; width:90%; max-width:300px;
      text-align:center; position:relative;
      box-shadow:0 0 40px rgba(232,0,29,0.3);
      animation:popup-in .35s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popup-in { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
    .popup-close {
      position:absolute; top:-12px; right:-12px;
      width:28px; height:28px;
      background:var(--red); color:#fff;
      border:none; border-radius:50%;
      font-size:15px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .popup-logo { width:54px; height:54px; border-radius:50%; margin-bottom:12px; }
    .popup-box h2 {
      font-family:'Barlow Condensed',sans-serif;
      font-size:22px; font-weight:800;
      text-transform:uppercase; color:#fff; margin-bottom:6px;
    }
    .popup-box p { font-size:13px; color:var(--gray); line-height:1.5; margin-bottom:16px; }
    .popup-btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 22px; background:var(--red); color:#fff;
      border-radius:8px; text-decoration:none;
      font-family:'Barlow Condensed',sans-serif;
      font-size:15px; font-weight:700; letter-spacing:.5px;
      transition:background .15s;
    }
    .popup-btn:hover { background:#c0001a; }

    /* ── Telegram FAB — mobile only ── */
    #tg-fab {
      display:none; position:absolute; bottom:70px; right:16px;
      z-index:9999; width:52px; height:52px; border-radius:50%;
      background:#0088cc; align-items:center; justify-content:center;
      text-decoration:none;
      box-shadow:0 2px 12px rgba(0,136,204,.5);
      animation:tg-pulse 1.5s ease-out infinite;
    }
    #tg-fab svg { fill:#fff; width:26px; height:26px; }
    @keyframes tg-pulse {
      0%   { box-shadow:0 0 0 0   rgba(0,136,204,.55); }
      80%  { box-shadow:0 0 0 14px rgba(0,136,204,0);  }
      100% { box-shadow:0 0 0 0   rgba(0,136,204,0);   }
    }
    @media (hover:none) and (pointer:coarse) { #tg-fab { display:flex; } }

    /* ── Fullscreen ── */
    #player-shell:fullscreen,
    #player-shell:-webkit-full-screen,
    #player-shell:-moz-full-screen { width:100vw !important; height:100vh !important; }
  </style>
</head>
<body>

<div id="player-shell">

  <!-- Shaka video container -->
  <div id="shaka-container">
    <video id="shaka-video" autoplay playsinline></video>
  </div>

  <!-- Iframe fallback -->
  <iframe id="iframe-el"
    allowfullscreen
    allow="autoplay; encrypted-media; picture-in-picture">
  </iframe>

  <!-- Iframe overlay -->
  <div id="iframe-overlay">
    <div class="ov-logo">
      <img src="https://i.ibb.co/0mLQWV1/sportssnap-net.png" alt="Sports Snap" onerror="this.style.display='none'">
    </div>
    <div id="ov-right-zone"></div>
    <button class="ov-fs-btn" id="iframe-fs-btn" title="Fullscreen">
      <svg id="iframe-fs-icon" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
  </div>

  <!-- Logo top-right -->
  <div id="brand-logo">
    <a href="https://www.sportssnap.net" target="_blank" rel="noopener">
      <img src="https://i.ibb.co/0mLQWV1/sportssnap-net.png" alt="Sports Snap" onerror="this.style.display='none'">
    </a>
  </div>

  <!-- Site label -->
  <div id="site-bar"><span><em>sports</em>snap.net</span></div>

  <!-- LOADING BANNER — shown while stream loads, hidden once playing -->
  <div id="load-banner">
    <img id="lb-logo" src="https://i.ibb.co/0mLQWV1/sportssnap-net.png" alt="Sports Snap" onerror="this.style.display='none'">
    <div id="lb-spinner-wrap">
      <div class="lb-ring"></div>
      <div id="lb-text"><em>sports</em>snap.net — loading stream…</div>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader"><div class="spinner-ring"></div><p>Loading stream…</p></div>

  <!-- Error -->
  <div id="error-msg">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <p>Stream unavailable</p>
  </div>

  <!-- Popup — desktop only -->
  <div id="popup">
    <div class="popup-box">
      <button class="popup-close" id="popup-close">✕</button>
      <img class="popup-logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Sports Snap" onerror="this.style.display='none'">
      <h2>Join Sports Snap</h2>
      <p>Get the latest live stream links &amp; updates on our Telegram channel</p>
      <a class="popup-btn" href="https://t.me/sportssnapofficial" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
        </svg>
        Join Telegram
      </a>
    </div>
  </div>

  <!-- Telegram FAB — mobile only -->
  <a id="tg-fab" href="https://t.me/sportssnapofficial" target="_blank" rel="noopener" title="Join Telegram">
    <svg viewBox="0 0 64 64"><path d="M56.4,8.2l-51.2,20c-1.7,0.6-1.6,3,0.1,3.5l9.7,2.9c2.1,0.6,3.8,2.2,4.4,4.3l3.8,12.1c0.5,1.6,2.5,2.1,3.7,0.9l5.2-5.3c0.9-0.9,2.2-1,3.2-0.3l11.5,8.4c1.6,1.2,3.9,0.3,4.3-1.7l8.7-41.8C60.4,9.1,58.4,7.4,56.4,8.2z M50,17.4L29.4,35.6c-1.1,1-1.9,2.4-2,3.9c-0.2,1.5-2.3,1.7-2.8,0.3l-0.9-3c-0.7-2.2,0.2-4.5,2.1-5.7l23.5-14.6C49.9,16.1,50.5,16.9,50,17.4z"/></svg>
  </a>

</div>

<script>
(function () {
  'use strict';

  const shell         = document.getElementById('player-shell');
  const iframeEl      = document.getElementById('iframe-el');
  const iframeOverlay = document.getElementById('iframe-overlay');
  const iframeFsBtn   = document.getElementById('iframe-fs-btn');
  const iframeFsIcon  = document.getElementById('iframe-fs-icon');
  const brandLogo     = document.getElementById('brand-logo');
  const loader        = document.getElementById('loader');
  const errorMsg      = document.getElementById('error-msg');
  const popup         = document.getElementById('popup');
  const popupClose    = document.getElementById('popup-close');
  const loadBanner    = document.getElementById('load-banner');

  const FS_ENTER = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
  const FS_EXIT  = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

  /* ── Helpers ── */
  function showLoader(v)  { loader.classList.toggle('hidden', !v); }
  function showError(msg) {
    showLoader(false);
    hideBanner();
    errorMsg.classList.add('show');
    if (msg) errorMsg.querySelector('p').textContent = msg;
  }

  function getParam(name) {
    const escaped = name.replace(/[\[\]]/g,'\\$&');
    const r = new RegExp('[?&]' + escaped + '(=([^&#]*)|&|#|$)').exec(location.href);
    if (!r) return null;
    return r[2] ? decodeURIComponent(r[2].replace(/\+/g,' ')) : '';
  }

  function detectType(url) {
    if (!url) return 'unknown';
    const u = url.toLowerCase().split('?')[0];
    if (u.endsWith('.m3u8')) return 'hls';
    if (u.endsWith('.mpd'))  return 'dash';
    return 'iframe';
  }

  /* ══ LOADING BANNER ══ */
  function hideBanner() {
    loadBanner.classList.add('hiding');
    setTimeout(() => loadBanner.classList.add('gone'), 600);
  }

  /* ══ SHAKA INIT ══ */
  async function initShaka(url, drmConfig) {
    showLoader(true);
    errorMsg.classList.remove('show');

    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
      showError('Browser not supported');
      return;
    }

    const video     = document.getElementById('shaka-video');
    const container = document.getElementById('shaka-container');

    const player = new shaka.Player(video);
    const ui     = new shaka.ui.Overlay(player, container, video);

    ui.configure({
      addSeekBar: true,
      addBigPlayButton: true,
      controlPanelElements: [
        'play_pause',
        'time_and_duration',
        'spacer',
        'mute',
        'volume',
        'overflow_menu',
        'fullscreen'
      ],
      overflowMenuButtons: [
        'quality',
        'captions',
        'language',
        'cast',
        'picture_in_picture',
        'loop'
      ],
      fadeDelay: 3,
      enableFullscreenOnRotation: false
    });

    player.addEventListener('error', (e) => {
      console.error('Shaka player error:', e.detail);
      showError('Stream unavailable');
    });

    if (drmConfig) {
      if (drmConfig.clearkey) {
        player.configure({
          drm: { clearKeys: { [drmConfig.clearkey.keyId]: drmConfig.clearkey.key } }
        });
      } else {
        player.configure({ drm: drmConfig });
      }
    }

    container.addEventListener('click', (e) => {
      const btn = e.target.closest(
        '.shaka-fullscreen-button, [aria-label="Fullscreen"], [aria-label="Exit Fullscreen"]'
      );
      if (!btn) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      isFullscreen() ? exitFullscreen() : goFullscreen();
    }, true);

    /* Hide banner as soon as video starts playing */
    video.addEventListener('playing', hideBanner, { once: true });

    try {
      await player.load(url);
      video.play().catch(() => {});
      showLoader(false);
    } catch (err) {
      console.error('Shaka load error:', err.code, err.message, err);
      showError('Stream unavailable');
    }
  }

  /* ══ IFRAME FALLBACK ══ */
  function loadIframe(url, sandbox) {
    brandLogo.classList.add('hidden');
    if (sandbox === true || sandbox === 'yes' || sandbox === 1) {
      iframeEl.setAttribute('sandbox',
        'allow-scripts allow-same-origin allow-presentation allow-orientation-lock');
    } else {
      iframeEl.removeAttribute('sandbox');
    }
    iframeEl.src = url;
    iframeEl.style.display = 'block';
    iframeOverlay.classList.add('active');
    showLoader(false);
    hideBanner();
  }

  /* ══ MAIN ══ */
  async function loadStream() {
    const key = getParam('sportssnap');
    if (!key) { showLoader(false); showError('No stream key provided'); return; }

    showLoader(true);

    try {
      const resp = await fetch('https://sportssnap.github.io/playlist/stream.json');
      const data = await resp.json();
      const stream = data[key];
      if (!stream) { showError('Stream unavailable'); return; }

      let url, drmConfig = null, type, sandboxFlag = false;

      if (typeof stream === 'string') {
        url  = stream;
        type = detectType(url);
      } else {
        url         = stream.url || stream.iframe || '';
        sandboxFlag = stream.sandbox || false;
        if (stream.drm && stream.drm.clearKeys) {
          const [[kId, k]] = Object.entries(stream.drm.clearKeys);
          drmConfig = { clearkey: { keyId: kId, key: k } };
        } else if (stream.drm) {
          drmConfig = stream.drm;
        }
        type = (stream.iframe || stream.type === 'iframe') ? 'iframe' : detectType(url);
      }

      if (type === 'iframe') loadIframe(url, sandboxFlag);
      else                   initShaka(url, drmConfig);

    } catch (err) {
      console.error('loadStream error:', err);
      showError('Stream unavailable');
    }
  }

  /* ══ FULLSCREEN ══ */
  function goFullscreen() {
    if      (shell.requestFullscreen)       shell.requestFullscreen();
    else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    else if (shell.mozRequestFullScreen)    shell.mozRequestFullScreen();
    if (screen.orientation && screen.orientation.lock)
      screen.orientation.lock('landscape').catch(() => {});
  }
  function exitFullscreen() {
    if      (document.exitFullscreen)       document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
  }
  function isFullscreen() {
    return !!(document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement);
  }

  iframeFsBtn.addEventListener('click', () => isFullscreen() ? exitFullscreen() : goFullscreen());

  function onFsChange() {
    if (!isFullscreen() && screen.orientation && screen.orientation.unlock)
      screen.orientation.unlock();
    iframeFsIcon.querySelector('path').setAttribute('d', isFullscreen() ? FS_EXIT : FS_ENTER);
  }
  document.addEventListener('fullscreenchange',       onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('mozfullscreenchange',    onFsChange);

  /* ══ POPUP ══ */
  setTimeout(() => popup.classList.add('show'), 7000);
  popupClose.addEventListener('click', () => popup.classList.remove('show'));
  popup.addEventListener('click', (e) => { if (e.target === popup) popup.classList.remove('show'); });

  /* ══ BOOT ══ */
  window.addEventListener('load', loadStream);
})();
</script>
</body>
