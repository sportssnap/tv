<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV - Multi Player</title>
  
  <!-- Plyr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
  
  <!-- DPlayer -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.26.0/dist/DPlayer.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/dplayer@1.26.0/dist/DPlayer.min.js"></script>
  
  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/8.21.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.21.0/video.min.js"></script>
  
  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.compiled.min.js"></script>
  
  <!-- Clappr -->
  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.plainhtml5.min.js"></script>
  
  <!-- JW Player -->
  <script src="https://cdn.jsdelivr.net/npm/jwplayer@8/dist/jwplayer.core.min.js"></script>

  <style>
    body { 
      margin: 0; padding: 0; 
      background: #000; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: white;
    }
    #video-container {
      max-width: 1200px;
      margin: 20px auto;
      position: relative;
      padding: 0 10px;
    }
    #player-wrapper { 
      width: 100%; 
      min-height: 560px; 
      background: #000; 
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    #logo {
      position: absolute; 
      top: 15px; 
      right: 15px; 
      width: 70px; 
      z-index: 100;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,0,64,0.6);
    }
    #running-banner {
      position: absolute; 
      bottom: 80px; 
      left: 0; 
      width: 100%;
      background: rgba(0,0,0,0.85); 
      color: #fff; 
      padding: 12px 0;
      z-index: 90; 
      text-align: center; 
      overflow: hidden;
      font-size: 17px;
      font-weight: 500;
    }
    #banner-text {
      display: inline-block; 
      white-space: nowrap; 
      animation: scroll 20s linear infinite;
    }
    @keyframes scroll { 
      0% { transform: translateX(100%); } 
      100% { transform: translateX(-100%); } 
    }
    .controls-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    select {
      background: #222;
      color: white;
      border: 1px solid #FF0040;
      border-radius: 6px;
      padding: 6px 10px;
    }
    .popup { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.95); 
      z-index: 1000; 
      justify-content: center; 
      align-items: center; 
    }
    .popup-content {
      background: #111; 
      padding: 35px; 
      border-radius: 16px; 
      text-align: center;
      border: 3px solid #FF0040; 
      max-width: 360px; 
      color: white;
      position: relative;
    }
    .close-btn {
      position: absolute; 
      top: -18px; 
      right: -18px; 
      background: #FF0040; 
      color: white;
      border: none; 
      width: 38px; 
      height: 38px; 
      border-radius: 50%; 
      font-size: 26px; 
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FF0040;
      font-size: 18px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <div class="controls-bar">
      <label>Player: </label>
      <select id="player-select">
        <option value="plyr">Plyr (Recommended)</option>
        <option value="shaka">Shaka Player (Best for MPD)</option>
        <option value="videojs">Video.js</option>
        <option value="dplayer">DPlayer</option>
        <option value="hls">HLS Native</option>
        <option value="clappr">Clappr</option>
        <option value="jw">JW Player</option>
      </select>
    </div>

    <div id="player-wrapper"></div>
    
    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Sports Snap Logo">
    
    <div id="running-banner">
      <div id="banner-text">Join Our Telegram @sportssnapofficial for more updates &amp; streams! | www.sportssnap.net</div>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h2>🚀 Join Sports Snap!</h2>
      <p>Get instant notifications for live matches and working streams.</p>
      <a href="https://t.me/sportssnapofficial" target="_blank" 
         style="display:inline-block;padding:14px 28px;background:#000;color:#FF0040;border:2px solid #FF0040;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:15px;">
        JOIN TELEGRAM CHANNEL
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    // Get channel from URL parameter
    function getStreamUrl() {
      const params = new URLSearchParams(window.location.search);
      let channel = null;
      
      for (let [key, value] of params) {
        if (key.toLowerCase().includes('sportssnap') && value) {
          channel = value;
          break;
        }
      }
      return channel;
    }

    let currentPlayer = null;
    let streamUrl = null;

    const container = document.getElementById('player-wrapper');
    const playerSelect = document.getElementById('player-select');

    // Fetch stream
    fetch('https://sportssnap.github.io/playlist/stream.json')
      .then(res => res.json())
      .then(data => {
        const channelParam = getStreamUrl();
        if (!channelParam) throw new Error("No channel specified in URL");
        
        streamUrl = data[channelParam];
        if (!streamUrl) throw new Error("Stream not found for this channel");
        
        initDefaultPlayer();
      })
      .catch(err => {
        console.error(err);
        container.innerHTML = `
          <div style="color:#FF0040;text-align:center;padding:120px 20px;font-size:20px;">
            ❌ Stream not available or invalid channel<br><br>
            <small style="color:#aaa;">Make sure URL has ?sportssnap_channel=xxx</small>
          </div>`;
      });

    function clearContainer() {
      if (currentPlayer) {
        try {
          if (currentPlayer.destroy) currentPlayer.destroy();
          if (currentPlayer.dispose) currentPlayer.dispose();
        } catch(e) {}
      }
      container.innerHTML = '';
    }

    function showLoading() {
      container.innerHTML = `<div class="loading">Loading stream...</div>`;
    }

    function initDefaultPlayer() {
      playerSelect.value = 'plyr';
      initPlyr();
    }

    // Player Switcher
    playerSelect.addEventListener('change', () => {
      if (!streamUrl) return;
      const type = playerSelect.value;
      
      clearContainer();
      showLoading();

      setTimeout(() => {
        switch(type) {
          case 'plyr': initPlyr(); break;
          case 'shaka': initShaka(); break;
          case 'videojs': initVideoJS(); break;
          case 'dplayer': initDPlayer(); break;
          case 'hls': initHlsNative(); break;
          case 'clappr': initClappr(); break;
          case 'jw': initJWPlayer(); break;
        }
      }, 100);
    });

    // 1. PLYR - Most Recommended
    function initPlyr() {
      container.innerHTML = `<video id="plyr-video" controls playsinline></video>`;
      const video = document.getElementById('plyr-video');
      
      if (Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, maxBufferLength: 30 });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }

      currentPlayer = new Plyr(video, {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen', 'pip', 'airplay'],
        settings: ['quality', 'speed', 'loop'],
        autoplay: true,
        quality: { default: 'auto', forced: true, options: ['auto'] }
      });
    }

    // 2. Shaka Player (Best for MPD/DASH)
    function initShaka() {
      container.innerHTML = `<video id="shaka-video" controls autoplay style="width:100%;height:100%;"></video>`;
      const video = document.getElementById('shaka-video');
      
      shaka.polyfill.installAll();
      const player = new shaka.Player(video);
      currentPlayer = player;
      
      player.load(streamUrl).catch(err => {
        console.error(err);
        container.innerHTML += `<p style="color:orange;text-align:center;padding:20px;">Shaka failed to load stream.</p>`;
      });
    }

    // 3. Video.js
    function initVideoJS() {
      container.innerHTML = `<video id="videojs-player" class="video-js vjs-default-skin vjs-big-play-centered" controls playsinline></video>`;
      currentPlayer = videojs('videojs-player', {
        fluid: true,
        autoplay: true,
        sources: [{
          src: streamUrl,
          type: streamUrl.toLowerCase().includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegURL'
        }]
      });
    }

    // 4. DPlayer
    function initDPlayer() {
      container.innerHTML = `<div id="dplayer" style="width:100%;height:560px;"></div>`;
      currentPlayer = new DPlayer({
        container: document.getElementById('dplayer'),
        autoplay: true,
        video: { 
          url: streamUrl, 
          type: streamUrl.toLowerCase().includes('.mpd') ? 'dash' : 'hls' 
        }
      });
    }

    // 5. HLS Native
    function initHlsNative() {
      container.innerHTML = `<video id="hls-video" controls autoplay style="width:100%;height:100%;"></video>`;
      const video = document.getElementById('hls-video');
      
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
      } else {
        video.src = streamUrl;
      }
    }

    // 6. JW Player
    function initJWPlayer() {
      container.innerHTML = `<div id="jwplayer" style="width:100%;height:560px;"></div>`;
      try {
        currentPlayer = jwplayer('jwplayer').setup({
          file: streamUrl,
          autostart: true,
          width: "100%",
          height: "100%"
        });
      } catch(e) {
        container.innerHTML += `<p style="color:orange;text-align:center;padding:20px;">JW Player failed to initialize.</p>`;
      }
    }

    // 7. Clappr
    function initClappr() {
      container.innerHTML = `<div id="clappr-player" style="width:100%;height:560px;"></div>`;
      currentPlayer = new Clappr.Player({
        source: streamUrl,
        parentId: '#clappr-player',
        height: '560px',
        width: '100%',
        autoplay: true
      });
    }

    // Popup
    setTimeout(() => {
      document.getElementById('popup').style.display = 'flex';
    }, 8000);

    document.querySelector('.close-btn').addEventListener('click', () => {
      document.getElementById('popup').style.display = 'none';
    });
  </script>
</body>
</html>
