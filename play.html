<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Snap TV - Shaka Player</title>

<!-- Shaka Player -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial;
}

#video-container {
    position: relative;
    width: 100%;
    height: 100vh;
    background: black;
}

video {
    width: 100%;
    height: 100%;
}

#logo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 50px;
    z-index: 10;
}

#running-banner {
    position: absolute;
    bottom: 80px;
    width: 100%;
    color: white;
    background: rgba(0,0,0,0.6);
    overflow: hidden;
}

#banner-text {
    white-space: nowrap;
    display: inline-block;
    padding-left: 100%;
    animation: scroll 12s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
}
</style>
</head>

<body>

<div id="video-container">

<div class="loading" id="loading">Loading...</div>

<video id="video" controls autoplay></video>

<img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png">

<div id="running-banner">
<div id="banner-text">
Join @sportssnapofficial | www.sportssnap.net
</div>
</div>

</div>

<script>
// -------------------- GET PARAM --------------------
function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
}

// -------------------- INIT SHAKA --------------------
async function initShaka(){

    const video = document.getElementById('video');

    if (!shaka.Player.isBrowserSupported()) {
        document.getElementById('loading').innerText = "Browser Not Supported";
        return;
    }

    shaka.polyfill.installAll();

    const player = new shaka.Player(video);

    player.addEventListener('error', (e) => {
        console.error('Shaka Error', e);
    });

    const channel = getParam('shaka_sportssnap');

    if(!channel){
        document.getElementById('loading').innerText = "No Channel Selected";
        return;
    }

    // Load JSON
    fetch('https://sportssnap.github.io/playlist/stream.json')
    .then(res => res.json())
    .then(async data => {

        const streamUrl = data[channel];

        if(!streamUrl){
            document.getElementById('loading').innerText = "Channel Not Found";
            return;
        }

        try {
            await player.load(streamUrl);
            document.getElementById('loading').style.display = "none";
        } catch (err) {
            console.error(err);
            document.getElementById('loading').innerText = "Failed to load stream";
        }

    });

}

document.addEventListener('DOMContentLoaded', initShaka);
</script>

</body>
</html>
