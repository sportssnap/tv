<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Snap TV</title>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #video-container {
      max-width: 800px;
      margin: auto;
      position: relative;
    }
    #video {
      width: 100%;
      height: 100%;
    }
    #logo {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 50px;
      z-index: 10;
      pointer-events: none;
    }
    /* Running banner styles */
    #running-banner {
      position: absolute;
      bottom: 200px;
      left: 0;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 0;
      z-index: 20;
      width: 100%;
      box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.5);
    }
    #banner-text {
      display: inline-block;
      white-space: nowrap;
      animation: scroll 10s linear infinite;
      font-size: 18px;
      padding-left: 100%;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* Plyr fullscreen adjustments */
    #video-container:fullscreen #logo,
    #video-container:-webkit-full-screen #logo {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 60px;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div id="video-container">
    <video id="video" controls poster="https://i.ibb.co/0mLQWV1/sportssnap-net.png"></video>
    <img id="logo" src="https://i.ibb.co/wzpjWHt/Sports-Snap-circle.png" alt="Logo">
    <div id="running-banner">
      <div id="banner-text">Join Our Telegram channel @sportssnapofficial for more updates!! | www.sportssnap.net</div>
    </div>
  </div>
  
  <div class="popup">
    <div class="popup-content">
      <button class="close-btn">×</button>
      <h1>Join Us!</h1>
      <p>Join Sports Snap Telegram channel for more updates!</p>
      <a class="join-btn" href="https://t.me/sportssnapofficial" target="_blank">Join Now</a>
    </div>
  </div>

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    // Get query parameter
    function getQueryParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    const key = getQueryParameter('sportssnap');
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');

    let player; // Plyr instance

    async function loadStream() {
      if (!key) {
        console.error('No sportssnap parameter provided. Example: ?sportssnap=barcelona');
        return;
      }

      try {
        const response = await fetch('https://sportssnap.github.io/playlist/stream.json');
        const data = await response.json();

        const m3u8Url = data[key];

        if (!m3u8Url) {
          console.error(`Stream not found for: ${key}`);
          return;
        }

        // Initialize HLS
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(m3u8Url);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            initPlyr();
          });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = m3u8Url;
          video.addEventListener('loadedmetadata', initPlyr);
        } 
        else {
          console.error('HLS not supported');
        }

      } catch (error) {
        console.error('Failed to load stream:', error);
      }
    }

    function initPlyr() {
      if (player) return;
      
      player = new Plyr(video, {
        controls: [
          'play-large', 'play', 'progress', 'current-time', 'duration',
          'mute', 'volume', 'settings', 'fullscreen'
        ],
        settings: ['quality', 'speed'],
        quality: { default: '1080', options: ['1080', '720', '480'] },
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
      });
    }

    // Double click for fullscreen
    video.addEventListener('dblclick', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        videoContainer.requestFullscreen();
      }
    });

    // Load stream
    loadStream();

    // Popup
    document.addEventListener('DOMContentLoaded', function() {
      let popupClosed = false;
      function showPopup() {
        if (!popupClosed) {
          document.querySelector('.popup').style.display = 'flex';
        }
      }
      setTimeout(showPopup, 6000);
      
      document.querySelector('.close-btn').addEventListener('click', function() {
        document.querySelector('.popup').style.display = 'none';
        popupClosed = true;
      });
    });
  </script>
</body>
</html>
